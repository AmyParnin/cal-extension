<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Smart Calendar</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      font-family: "Google Sans", Roboto, sans-serif;
      font-size: 14px;
      color: #202124;
      background: #fff;
      padding: 16px;
    }

    h1 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    label {
      display: block;
      font-size: 12px;
      color: #5f6368;
      margin-bottom: 4px;
      margin-top: 10px;
    }

    input, textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #dadce0;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
    }

    textarea {
      height: 72px;
      resize: vertical;
    }

    #ai-hint {
      font-size: 11px;
      color: #5f6368;
      margin-top: 4px;
    }

    #parse-btn {
      margin-top: 8px;
      width: 100%;
      padding: 8px;
      background: #f1f3f4;
      border: 1px solid #dadce0;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }

    #parse-btn:hover { background: #e8eaed; }

    hr { margin: 14px 0; border: none; border-top: 1px solid #f1f3f4; }

    .mode-selector {
      display: flex;
      border: 1px solid #dadce0;
      border-radius: 8px;
      overflow: hidden;
      margin-top: 12px;
    }

    .mode-btn {
      flex: 1;
      padding: 7px 4px;
      background: #fff;
      border: none;
      border-right: 1px solid #dadce0;
      cursor: pointer;
      font-size: 12px;
      color: #5f6368;
      font-family: inherit;
      transition: background 0.1s;
    }

    .mode-btn:last-child { border-right: none; }

    .mode-btn:hover:not(.active) { background: #f1f3f4; }

    .mode-btn.active {
      background: #fde8e6;
      color: #c0394b;
      font-weight: 600;
    }

    .mode-label {
      font-size: 11px;
      color: #5f6368;
      margin-top: 8px;
      margin-bottom: 2px;
    }

    #create-btn {
      width: 100%;
      padding: 10px;
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      margin-top: 12px;
    }

    #create-btn:disabled { background: #a8c7fa; cursor: default; }

    #status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      min-height: 28px;
    }

    #status {
      font-size: 12px;
      flex: 1;
    }

    #open-btn {
      display: none;
      padding: 5px 10px;
      background: #fff;
      color: #1a73e8;
      border: 1px solid #1a73e8;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
    }

    #open-btn:hover { background: #e8f0fe; }

    .success { color: #1e8e3e; }
    .error   { color: #d93025; }
  </style>
</head>
<body>
  <h1>📅 Smart Calendar</h1>

  <!-- Natural language input -->
  <label for="nl-input">Describe your event</label>
  <textarea id="nl-input" placeholder="e.g. Lunch with Sarah next Tuesday at noon for 1 hour at Tartine Bakery"></textarea>
  <div id="ai-hint">✨ Describe it naturally — AI will fill in the details</div>
  <button id="parse-btn">✦ Parse with AI</button>

  <hr />

  <!-- Editable fields (pre-filled by AI or manually entered) -->
  <label for="title">Title</label>
  <input id="title" type="text" placeholder="Event title" />

  <!-- Event type selector -->
  <p class="mode-label">Type</p>
  <div class="mode-selector" role="group" aria-label="Event type">
    <button class="mode-btn active" id="mode-timed"  data-mode="timed">⏰ Timed event</button>
    <button class="mode-btn"        id="mode-allday" data-mode="allday">📅 All-day</button>
    <button class="mode-btn"        id="mode-task"   data-mode="task">✓ Task</button>
  </div>

  <!-- Timed event fields -->
  <div id="timed-fields">
    <label for="datetime">Date &amp; Time</label>
    <input id="datetime" type="datetime-local" />

    <label for="duration">Duration (minutes)</label>
    <input id="duration" type="number" value="60" min="5" step="5" />
  </div>

  <!-- All-day event fields -->
  <div id="allday-fields" style="display:none">
    <label for="startdate">Start Date</label>
    <input id="startdate" type="date" />

    <label for="enddate">End Date</label>
    <input id="enddate" type="date" />
  </div>

  <!-- Task fields -->
  <div id="task-fields" style="display:none">
    <label for="task-date">Due date</label>
    <input id="task-date" type="date" />

    <label for="task-time">Due time (optional)</label>
    <input id="task-time" type="time" placeholder="Leave blank for all-day task" />
  </div>

  <!-- Location hidden for tasks (Tasks API has no location field) -->
  <div id="location-row">
    <label for="location">Location (optional)</label>
    <input id="location" type="text" placeholder="Address or video link" />
  </div>

  <label for="description">Notes (optional)</label>
  <textarea id="description" rows="3" placeholder="Extra details"></textarea>

  <button id="create-btn">Add to Google Calendar</button>

  <div id="status-row">
    <span id="status"></span>
    <button id="open-btn">Open in Calendar ↗</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
